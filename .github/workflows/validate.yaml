name: Validate Terraform

# Catches config errors, including upstream module/provider versions that
# don't actually resolve, before they get tagged and published
# (see https://github.com/kosli-dev/server/issues/6987).

on:
  pull_request:
    paths:
      - "**/*.tf"
      - ".github/workflows/validate.yaml"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - ".github/workflows/validate.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - examples/ecs
          - examples/lambda-report-all
          - examples/lambda-report-selectively
          - examples/s3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: terraform init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate
